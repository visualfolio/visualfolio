name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visualfolio
          POSTGRES_PASSWORD: visualfolio
          POSTGRES_DB: visualfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visualfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost
      DATABASE_URL: postgresql://visualfolio:visualfolio@localhost:5432/visualfolio
    defaults:
      run:
        working-directory: visualfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check that migrations match the models
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: uv run --no-project --python 3.12 --with-requirements requirements.txt python manage.py test main

  image:
    needs: test
    if: (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.repository == 'visualfolio/visualfolio'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/visualfolio/visualfolio
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Require a vX.Y.Z release tag
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$VERSION' is not vX.Y.Z"
            exit 1
          fi
      - name: Enable arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt
          sudo systemctl restart systemd-binfmt
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Log in to GHCR
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build visualfolio \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --push
